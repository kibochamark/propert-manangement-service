
services:
  jupecom-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      jupecom-service:
        condition: service_healthy


  jupecom-service:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_PASSWORD: jupecom
      POSTGRES_DB: jupecom
      POSTGRES_USER: user
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jupecom"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
  
  prisma-migrate:
    image: docker.io/library/node:24.18-alpine3.24
    working_dir: /app
    command: sh -c "pnpm install && && npx prisma migrate dev && npx prisma migrate deploy"
    volumes:
      - .:/app
    depends_on:
      jupecom-service:
        condition: service_healthy

volumes:
  db_data: